# Publica la imagen Docker del servicio en GitHub Container Registry al mergear a main.
# En los pull requests no hace falta: el job "docker" de ci.yml ya construye la imagen.
name: Publish image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ingsis-mak-lr-dk/snippet-handler

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: "latest" y "sha-<commit corto>". Tambien agrega las etiquetas OCI que enlazan la
      # imagen con este repositorio.
      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Para bajar el plugin de ci-kit hace falta login: se pasan como secretos de build
      # (no quedan guardados en la imagen). Solo amd64, que es lo que usan las VM de Azure: el
      # Dockerfile compila en la arquitectura destino, y emular arm64 en el CI seria muy lento.
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            gpr_user=${{ github.actor }}
            gpr_key=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
