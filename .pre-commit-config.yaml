repos:
  - repo: local
    hooks:
      - id: gradle-check
        name: ./gradlew check (spotless, checkstyle, tests, JaCoCo)
        entry: ./gradlew check
        language: system
        pass_filenames: false
        # Instalar: pip install pre-commit && pre-commit install
        # A partir de ahi corre ./gradlew check en cada commit.
