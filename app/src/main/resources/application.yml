spring:
  config:
    # Carga AUTH0_* (y el resto) desde el .env de la raiz del repo, si existe (ver .env.example).
    # Las variables de entorno con el mismo nombre ganan sobre el archivo.
    import: optional:file:.env[.properties]
  application:
    name: snippet-handler-service
  # Se pisan con SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5433/snippets
    username: snippets
    password: snippets
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # El "iss" de Auth0 es "https://<tenant>/" (con esquema y barra final). Spring lo compara
          # como string exacto, asi que el formato tiene que coincidir.
          issuer-uri: https://${AUTH0_DOMAIN}/
          # Rechaza los tokens que no fueron emitidos para esta API (claim "aud").
          audiences: ${AUTH0_AUDIENCE}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

snippet:
  default-language: printscript
  # US 12 y 15: reproceso en segundo plano de los snippets cuando cambian las reglas.
  reprocessing:
    enabled: true
    max-attempts: 3
    claim-idle: 30s
    poll-interval: 500ms
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  asset:
    url: ${ASSET_SERVICE_URL:http://localhost:8082}
    container: ${ASSET_CONTAINER:snippets}
  permission:
    url: ${PERMISSION_SERVICE_URL:http://localhost:8081}
  # Auth0 Management API del mismo tenant (busqueda de usuarios para compartir, US 7).
  users:
    auth0-domain: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
    client-id: ${AUTH0_MANAGEMENT_CLIENT_ID:}
    client-secret: ${AUTH0_MANAGEMENT_CLIENT_SECRET:}
  # Token propio para las llamadas a los adaptadores sin usuario (tests de US 16, revalidacion).
  # Client M2M de Auth0 autorizado para la misma API que valida el resto de los servicios.
  service-token:
    auth0-domain: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
    client-id: ${AUTH0_SERVICE_CLIENT_ID:}
    client-secret: ${AUTH0_SERVICE_CLIENT_SECRET:}
    audience: ${spring.security.oauth2.resourceserver.jwt.audiences}
  languages:
    printscript:
      url: ${PRINTSCRIPT_SERVICE_URL:http://localhost:8083}
      versions: ["1.0", "1.1"]
      file-extension: ps
