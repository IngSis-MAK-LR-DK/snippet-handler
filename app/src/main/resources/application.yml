spring:
  application:
    name: snippet-handler-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:snippets}
    username: ${DB_USER:snippets}
    password: ${DB_PASSWORD:snippets}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth0: https://<tenant>.auth0.com/ (con la barra final)
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

snippet:
  default-language: printscript
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  asset:
    url: ${ASSET_SERVICE_URL:http://localhost:8081}
    container: ${ASSET_CONTAINER:snippets}
  permission:
    url: ${PERMISSION_SERVICE_URL:http://localhost:8082}
  languages:
    printscript:
      url: ${PRINTSCRIPT_SERVICE_URL:http://localhost:8083}
      versions: ["1.0", "1.1"]
      file-extension: ps
