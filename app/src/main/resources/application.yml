spring:
  application:
    name: snippet-handler-service
  # Se pisan con SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5433/snippets
    username: snippets
    password: snippets
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth0: https://<tenant>.auth0.com/ (con la barra final)
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

snippet:
  default-language: printscript
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  asset:
    url: ${ASSET_SERVICE_URL:http://localhost:8082}
    container: ${ASSET_CONTAINER:snippets}
  permission:
    url: ${PERMISSION_SERVICE_URL:http://localhost:8081}
  users:
    auth0-domain: ${AUTH0_MANAGEMENT_DOMAIN:}
    client-id: ${AUTH0_MANAGEMENT_CLIENT_ID:}
    client-secret: ${AUTH0_MANAGEMENT_CLIENT_SECRET:}
  # Token propio para las llamadas a los adaptadores sin usuario (tests de US 16, revalidacion).
  # Client M2M de Auth0 autorizado para la misma API que valida el resto de los servicios.
  service-token:
    auth0-domain: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
    client-id: ${AUTH0_SERVICE_CLIENT_ID:}
    client-secret: ${AUTH0_SERVICE_CLIENT_SECRET:}
    audience: ${spring.security.oauth2.resourceserver.jwt.audiences}
  languages:
    printscript:
      url: ${PRINTSCRIPT_SERVICE_URL:http://localhost:8083}
      versions: ["1.0", "1.1"]
      file-extension: ps
